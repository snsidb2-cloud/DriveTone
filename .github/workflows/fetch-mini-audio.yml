name: Fetch Mini Cooper audio preview

on:
  push:
    paths:
      - '.github/workflows/fetch-mini-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Freesound public preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          EMBED='https://freesound.org/embed/sound/iframe/669622/simple/medium/'
          curl -fsSL "$EMBED" -o /tmp/embed.html
          PREVIEW=$(python3 - <<'PY'
          import html,re
          text=open('/tmp/embed.html',encoding='utf-8').read()
          m=re.search(r'class="mp3_file"\s+href="([^"]+)"', text)
          if not m:
              m=re.search(r'href="([^"]+)"[^>]*class="mp3_file"', text)
          if not m:
              raise SystemExit('Could not find Freesound MP3 preview URL')
          print(html.unescape(m.group(1)))
          PY
          )
          echo "Preview: $PREVIEW"
          curl -fL --retry 3 "$PREVIEW" -o assets/audio/mini-cooper-gunning.mp3
          test -s assets/audio/mini-cooper-gunning.mp3
          file assets/audio/mini-cooper-gunning.mp3
          ls -lh assets/audio/mini-cooper-gunning.mp3

      - name: Commit preview into DriveTone
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/mini-cooper-gunning.mp3
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Add Mini Cooper Gunning-it CC0 preview"
          git push
